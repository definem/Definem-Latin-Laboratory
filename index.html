<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lotincha lugʻat testi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@1,500;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EEEC; --sheet:#F7F9F8; --ink:#1B2A47; --muted:#5C6B7E; --line:#C9D3D1;
  --artery:#B3303B; --artery-soft:#F4DCDD; --vein:#2C5AA0; --ok:#2E7A55; --ok-soft:#D9EEE2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121A26; --sheet:#1A2433; --ink:#E6ECF2; --muted:#98A6B8; --line:#2C3A4E;
    --artery:#E0626C; --artery-soft:#3A1F26; --vein:#7FA8E8; --ok:#5CC08E; --ok-soft:#173327;
  }
}
:root[data-theme="dark"]{
  --paper:#121A26; --sheet:#1A2433; --ink:#E6ECF2; --muted:#98A6B8; --line:#2C3A4E;
  --artery:#E0626C; --artery-soft:#3A1F26; --vein:#7FA8E8; --ok:#5CC08E; --ok-soft:#173327;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
.latin{font-family:"Cormorant","Cormorant Garamond",Georgia,"Times New Roman",serif;font-style:italic}
h1{font-size:2.6rem;line-height:1.05;margin:8px 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 28px}
.screen[hidden]{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--vein);outline-offset:2px}

/* start screen */
.group{margin:0 0 24px}
.group h2{font-size:1rem;font-weight:600;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 16px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.primary{display:block;width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--sheet);
  padding:16px;font-size:1.05rem;font-weight:600}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;background:transparent;
  padding:14px;font-weight:600;margin-top:10px}
.stats{margin-top:32px;border-top:1px solid var(--line);padding-top:20px}
.stats h2{font-size:1rem;margin:0 0 12px}
.statrow{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px}
.statrow div{min-width:80px}
.statrow b{display:block;font-size:1.5rem;line-height:1.2}
.statrow span{color:var(--muted);font-size:.875rem}
.missed{margin:0;padding:0;list-style:none}
.missed li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.missed li .latin{font-size:1.2rem}
.missed li small{color:var(--artery);white-space:nowrap}
.empty{color:var(--muted);font-size:.95rem;margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.875rem;margin-top:16px}

/* quiz */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.topbar .quit{background:none;border:0;color:var(--muted);padding:4px 0;font-size:.95rem}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--vein);transition:width .3s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;min-width:52px;text-align:right}

/* the specimen label — anatomical-plate style */
.plate{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:4px;
  padding:34px 24px 30px 48px;margin-bottom:22px;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.plate::before{content:"";position:absolute;left:18px;top:50%;width:10px;height:10px;border-radius:50%;
  background:var(--artery);transform:translateY(-50%)}
.plate::after{content:"";position:absolute;left:28px;top:50%;width:14px;height:1.5px;background:var(--artery)}
.word{font-size:clamp(2.3rem,9vw,3.3rem);line-height:1.05;font-weight:600;margin:0;overflow-wrap:anywhere}
.gram{color:var(--muted);margin-top:6px;font-size:1rem}
.gram:empty{display:none}

.options{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--sheet);
  border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1.02rem;min-height:56px;
  transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt kbd{font-family:inherit;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;
  width:24px;height:24px;display:inline-grid;place-items:center;flex:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--artery);background:var(--artery-soft)}
.opt.dim{opacity:.5}
.next{margin-top:18px}
.feedback{min-height:24px;margin:16px 0 0;font-weight:600}
.feedback.good{color:var(--ok)}
.feedback.bad{color:var(--artery)}

/* result */
.score{font-size:4.5rem;line-height:1;font-weight:700;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.score small{font-size:1.6rem;color:var(--muted);font-weight:500}
.verdict{font-size:1.15rem;margin:0 0 24px}
.review h2{font-size:1rem;margin:28px 0 8px}
.review ul{list-style:none;margin:0;padding:0}
.review li{padding:10px 0;border-bottom:1px dashed var(--line)}
.review li .latin{font-size:1.3rem;font-weight:600}
.review li .ans{display:block;font-size:.95rem}
.review li .ans s{color:var(--artery)}
.review li .ans b{color:var(--ok);font-weight:600}

.credit{margin-top:48px;text-align:center;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>

<!-- START -->
<section class="screen" id="start">
  <h1 class="latin">Vocabularium anatomicum</h1>
  <p class="sub">Lotincha soʻzni koʻrib, toʻgʻri tarjimani tanlang. Lugʻatda <span id="total"></span> ta soʻz bor.</p>

  <div class="group">
    <h2>Nechta savol?</h2>
    <div class="chips" id="counts"></div>
  </div>

  <button class="primary" id="go">Testni boshlash</button>
  <button class="secondary" id="goMistakes" hidden>Xatolar ustida ishlash</button>

  <div class="stats" id="stats"></div>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz" hidden>
  <div class="topbar">
    <button class="quit" id="quit">Toʻxtatish</button>
    <div class="bar"><i id="barFill"></i></div>
    <div class="count" id="count"></div>
  </div>
  <div class="plate">
    <p class="word latin" id="word"></p>
    <div class="gram" id="gram"></div>
  </div>
  <div class="options" id="options"></div>
  <p class="feedback" id="feedback" aria-live="polite"></p>
  <button class="primary next" id="next" hidden>Keyingi savol</button>
</section>

<!-- RESULT -->
<section class="screen" id="result" hidden>
  <div class="score" id="score"></div>
  <p class="verdict" id="verdict"></p>
  <button class="primary" id="again">Yana test ishlash</button>
  <button class="secondary" id="retryWrong" hidden>Shu testdagi xatolarni qayta ishlash</button>
  <button class="secondary" id="home">Bosh sahifa</button>
  <div class="review" id="review"></div>
</section>

<footer class="credit">By developer_gurl</footer>
</main>

<script src="words.js"></script>
<script>
const words = [];
{ const seen = new Set();
  for (const [la, gram, uz] of WORDS) {           // himoya: tasodifan takror qoʻshilsa ham bittasi qoladi
    const k = la.trim().toLowerCase();
    if (seen.has(k)) continue; seen.add(k);
    words.push({ la: la.trim(), gram, uz });
  }
}
const $ = id => document.getElementById(id);
$("total").textContent = words.length;

/* ---- storage (faqat shu brauzerda) ---- */
const KEY = "lotin-lugat-v1";
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.words && s.history) return s; } catch (e) {}
  return { history: [], words: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
let store = load();

/* ---- helpers ---- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const kind = w => (/ oid$/.test(w.uz) ? "adj" : "") + (w.la.includes(" ") ? "phrase" : "single");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function distractors(w) {
  const pool = words.filter(x => x.la !== w.la && x.uz !== w.uz);
  const same = shuffle(pool.filter(x => kind(x) === kind(w)));
  const rest = shuffle(pool.filter(x => kind(x) !== kind(w)));
  const out = [], used = new Set([w.uz]);
  for (const x of [...same, ...rest]) { if (!used.has(x.uz)) { used.add(x.uz); out.push(x.uz); } if (out.length === 3) break; }
  return out;
}

/* ---- start screen ---- */
const COUNTS = [10, 20, 30, 50, "Hammasi"];
let chosen = 20;
function renderCounts() {
  $("counts").innerHTML = COUNTS.map(c =>
    `<button class="chip" aria-pressed="${c === chosen}" data-c="${c}">${c}</button>`).join("");
}
$("counts").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  chosen = b.dataset.c === "Hammasi" ? "Hammasi" : +b.dataset.c; renderCounts();
});

function mistakeWords() {
  return words.filter(w => { const s = store.words[w.la]; return s && s.wrong > 0; })
    .sort((a, b) => store.words[b.la].wrong - store.words[a.la].wrong);
}

function renderStats() {
  const h = store.history;
  const mw = mistakeWords();
  $("goMistakes").hidden = mw.length === 0;
  $("goMistakes").textContent = `Xatolar ustida ishlash (${mw.length} ta soʻz)`;
  if (!h.length) {
    $("stats").innerHTML = `<h2>Sizning natijalaringiz</h2><p class="empty">Hali test ishlanmagan. Birinchi testdan keyin natijalar shu yerda koʻrinadi.</p>`;
    return;
  }
  const totalQ = h.reduce((s, x) => s + x.total, 0), totalC = h.reduce((s, x) => s + x.correct, 0);
  const best = Math.max(...h.map(x => Math.round(x.correct / x.total * 100)));
  const learned = Object.keys(store.words).filter(k => store.words[k].right > 0).length;
  const top = mw.slice(0, 5).map(w =>
    `<li><span><span class="latin">${esc(w.la)}</span> — ${esc(w.uz)}</span><small>${store.words[w.la].wrong} marta xato</small></li>`).join("");
  $("stats").innerHTML = `
    <h2>Sizning natijalaringiz</h2>
    <div class="statrow">
      <div><b>${h.length}</b><span>test ishlangan</span></div>
      <div><b>${Math.round(totalC / totalQ * 100)}%</b><span>oʻrtacha</span></div>
      <div><b>${best}%</b><span>eng yaxshi</span></div>
      <div><b>${learned}/${words.length}</b><span>soʻz topilgan</span></div>
    </div>
    ${top ? `<h2>Koʻp xato qilinganlar</h2><ul class="missed">${top}</ul>` : ""}
    <button class="linkbtn" id="reset">Natijalarni tozalash</button>`;
  $("reset").onclick = () => { if (confirm("Barcha natijalar oʻchiriladi. Davom etasizmi?")) { store = { history: [], words: {} }; save(); renderStats(); } };
}

/* ---- quiz ---- */
let queue = [], idx = 0, correct = 0, wrongList = [], answered = false, currentOpts = [];

function show(id) { for (const s of document.querySelectorAll(".screen")) s.hidden = s.id !== id; window.scrollTo(0, 0); }

function startQuiz(list) {
  queue = list; idx = 0; correct = 0; wrongList = [];
  show("quiz"); ask();
}

function ask() {
  const w = queue[idx]; answered = false;
  $("word").textContent = w.la;
  $("gram").textContent = w.gram;
  $("count").textContent = `${idx + 1} / ${queue.length}`;
  $("barFill").style.width = (idx / queue.length * 100) + "%";
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  $("next").hidden = true;
  currentOpts = shuffle([w.uz, ...distractors(w)]);
  $("options").innerHTML = currentOpts.map((o, i) =>
    `<button class="opt" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join("");
}

function choose(i) {
  if (answered) return; answered = true;
  const w = queue[idx], ok = currentOpts[i] === w.uz;
  const st = store.words[w.la] || (store.words[w.la] = { right: 0, wrong: 0 });
  document.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (currentOpts[j] === w.uz) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if (ok) { correct++; st.right++; if (st.wrong > 0) st.wrong--; $("feedback").textContent = "Toʻgʻri!"; $("feedback").classList.add("good"); }
  else { st.wrong++; wrongList.push({ w, picked: currentOpts[i] }); $("feedback").textContent = `Notoʻgʻri. Toʻgʻri javob: ${w.uz}`; $("feedback").classList.add("bad"); }
  save();
  $("next").textContent = idx + 1 < queue.length ? "Keyingi savol" : "Natijani koʻrish";
  $("next").hidden = false; $("next").focus({ preventScroll: true });
}

$("options").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) choose(+b.dataset.i); });
$("next").onclick = () => { idx++; idx < queue.length ? ask() : finish(); };
$("quit").onclick = () => { if (idx > 0 || answered) finish(true); else { show("start"); renderStats(); } };

document.addEventListener("keydown", e => {
  if ($("quiz").hidden) return;
  if (!answered && /^[1-4]$/.test(e.key)) choose(+e.key - 1);
  else if (answered && e.key === "Enter" && document.activeElement !== $("next")) $("next").click();
});

/* ---- result ---- */
function finish(early) {
  const total = early ? idx + (answered ? 1 : 0) : queue.length;
  if (total === 0) { show("start"); renderStats(); return; }
  store.history.push({ date: Date.now(), total, correct });
  save();
  const pct = Math.round(correct / total * 100);
  $("score").innerHTML = `${correct}<small> / ${total}</small>`;
  $("verdict").textContent = `${pct}% toʻgʻri. ` + (pct === 100 ? "Ajoyib, birorta ham xato yoʻq!" : pct >= 85 ? "Juda yaxshi natija." : pct >= 60 ? "Yomon emas, xatolarni yana bir koʻrib chiqing." : "Xatolar ustida ishlab, qayta urinib koʻring.");
  $("retryWrong").hidden = wrongList.length === 0;
  $("review").innerHTML = wrongList.length ? `<h2>Xato qilingan soʻzlar</h2><ul>${wrongList.map(({ w, picked }) =>
    `<li><span class="latin">${esc(w.la)}</span><span class="ans"><s>${esc(picked)}</s> → <b>${esc(w.uz)}</b></span></li>`).join("")}</ul>` : "";
  $("barFill").style.width = "100%";
  show("result");
}

function takeN() { return chosen === "Hammasi" ? shuffle(words) : shuffle(words).slice(0, chosen); }
$("go").onclick = () => startQuiz(takeN());
$("goMistakes").onclick = () => startQuiz(shuffle(mistakeWords().slice(0, 30)));
$("again").onclick = () => startQuiz(takeN());
$("retryWrong").onclick = () => startQuiz(shuffle(wrongList.map(x => x.w)));
$("home").onclick = () => { show("start"); renderStats(); };

renderCounts(); renderStats(); show("start");
</script>
</body>
</html>
